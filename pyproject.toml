[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-screen"
version = "0.5.0"
description = "Select part of your screen and see the text translated in place."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.5",
    "Pillow>=10.0",
    "pynput>=1.7.6",
    "requests>=2.31",
    "numpy>=1.24",
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "subword-nmt>=0.3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.5"]

[project.scripts]
scan-screen = "scan_screen.app:main"

[tool.setuptools]
packages = ["scan_screen"]
