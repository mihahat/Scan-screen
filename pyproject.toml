[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-screen"
version = "0.1.0"
description = "Select part of your screen and see the text translated in place."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.5",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pynput>=1.7.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scan-screen = "scan_screen.app:main"

[tool.setuptools]
packages = ["scan_screen"]
